<app-menu></app-menu>

<div class="login-container">
    <h2>Inicio de sesión</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" (input)="onInputChange()" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" (input)="onInputChange()" required>
        </div>

        <button type="submit">Inciar sesión</button>
    </form>

    <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
    </div>

    <a href="/register">¿No tienes cuenta todavía? Registrate</a>
    <a href="/forgot-password">¿Has olvidado la contraseña? Haz click aquí para recuperarla</a>
    <a href="/resend-confirm-email">¿No has verificado tu correo aún? Haz click aquí para enviar de nuevo el email</a>
</div>
