<app-menu></app-menu>

<div class="purchase-container" *ngIf="user && cartItems.length > 0;">
    <h2>¡Compra completada!</h2>
    <p class="thanks-message">Gracias por tu compra, {{ user.username }}. Aquí tienes los detalles:</p>

    <div class="buyer-data">
        <p><strong>Email:</strong> {{ user.emailAddress }}</p>
        <p><strong>Dirección:</strong> {{ user.address }}</p>
        <p><strong>Teléfono:</strong> {{ user.phoneNumber }}</p>
    </div>

    <div class="cartas-compradas container mt-4">
        <h4 class="text-center mb-4">Cartas compradas</h4>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-2 g-4">
            <div class="col" *ngFor="let carta of cartItems">
                <div class="card cartas shadow-sm h-100">
                    <img [src]="carta.imageUrl" [alt]="carta.pokemonName" class="img-carta card-img-top" />
                    <div class="card-body text-center">
                        <h5 class="nombre-pokemon card-title">{{ carta.pokemonName }}</h5>
                        <p class="card-text precio-carta">{{ carta.price }}€</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="acciones">
        <button type="submit" class="btn btn-warning" routerLink="/home">Seguir comprando</button>
    </div>
</div>
<div *ngIf="errorMessage" class="error-message text-center mt-5">
    {{ errorMessage }}
</div>
