<app-menu></app-menu>

<div class="reset-container">
    <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm">
        <div class="form-group">
            <label for="newPassword">Nueva contraseña:</label>
            <input type="password" name="newPassword" id="newPassword" [(ngModel)]="newPassword" required>
        </div>

        <div class="form-group">
            <label for="confirmNewPassword">Confirma la nueva contraseña:</label>
            <input type="password" name="confirmNewPassword" id="confirmNewPassword" [(ngModel)]="confirmNewPassword" required>
        </div>

        <button type="submit">Cambiar contraseña</button>

        <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </form>
</div>
