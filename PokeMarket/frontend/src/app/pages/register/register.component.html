<app-menu></app-menu>

<div class="register-container">
    <h2>Registrarse</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="form-group">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" [(ngModel)]="username" (input)="onInputChange()" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" (input)="onInputChange()" required>
        </div>

        <div class="form-group">
            <label for="confirm-email">Confirma el email:</label>
            <input type="email" id="confirm-email" name="confirmEmail" [(ngModel)]="confirmEmail" (input)="onInputChange()" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" (input)="onInputChange()" required>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirma la contraseña:</label>
            <input type="password" id="confirm-password" name="confirmPassword" [(ngModel)]="confirmPassword" (input)="onInputChange()" required>
        </div>

        <button type="submit">Registrarse</button>

        <div *ngIf="successMessage" class="success-message">
            {{ successMessage }}<br>
            <button (click)="goToLogin()">Iniciar sesión</button>
        </div>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>
        <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
</div>
