<app-menu></app-menu>

<div class="profile-container">
    <div class="menu-simple">
        <button type="button" routerLink="/home" class="icono-home">
            <i class="bi bi-house"></i>
        </button>
        <i class="bi bi-chevron-right" style="font-size: 1.4rem; font: bold;"></i>

        <button *ngIf="user" [routerLink]="['/profile', user.id]" class="menu-principal">
            Menú principal
        </button>

        <i class="bi bi-chevron-right" style="font-size: 1.4rem; font: bold;"></i>
        <span class="mi-perfil">
            Mi perfil
        </span>
    </div>
    <h2>Mi perfil</h2>
    <div class="profile-tabs">

        <button [class.active]="selectedTab === 'personal'" (click)="selectedTab = 'personal'">Perfil</button>
        <button [class.active]="selectedTab === 'create'" (click)="selectedTab = 'create'">Crear carta</button>
        <button [class.active]="selectedTab === 'mycards'" (click)="selectedTab = 'mycards'">Mis cartas</button>
        <button [class.active]="selectedTab === 'requestGrade'" (click)="selectedTab = 'requestGrade'">Solicitar gradeo</button>
        <button *ngIf="user?.role === 'admin'" [class.active]="selectedTab === 'adminPanel'" (click)="selectedTab = 'adminPanel'">Panel admin</button>
        <button *ngIf="user?.role === 'admin'" [class.active]="selectedTab === 'createtag'" (click)="selectedTab = 'createtag'">Create tag</button>
        <button *ngIf="user?.role === 'admin' || user?.role === 'grader' " [class.active]="selectedTab === 'gradeCards'" (click)="selectedTab = 'gradeCards'">Gradear cartas</button>
    </div>
    <div class="profile-content">
        <div class="contenedor-personal-info">
            <app-personal-info *ngIf="selectedTab === 'personal'"></app-personal-info>

        </div>
        <app-create-card *ngIf="selectedTab === 'create'"></app-create-card>
        <app-my-cards *ngIf="selectedTab === 'mycards'"></app-my-cards>
        <app-request-grade *ngIf="selectedTab === 'requestGrade'"></app-request-grade>
        <app-admin *ngIf="selectedTab === 'adminPanel'"></app-admin>
        <app-tag-panel *ngIf="selectedTab === 'createtag'"></app-tag-panel>
        <app-grading *ngIf="selectedTab === 'gradeCards'"></app-grading>
    </div>
</div>
