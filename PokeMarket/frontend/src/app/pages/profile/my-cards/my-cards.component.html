<div class="container-fluid">

    <!-- Filtros de texto -->
    <div class="my-3 d-flex justify-content-center gap-2 flex-wrap">
        <input type="text" [(ngModel)]="pokemonName" (input)="onFilterOrOrderChange()" placeholder="Filtrar por nombre..." class="form-control w-auto" />
        <input type="text" [(ngModel)]="collection" (input)="onFilterOrOrderChange()" placeholder="Filtrar por colección..." class="form-control w-auto" />
        <input type="text" [(ngModel)]="pokemonType" (input)="onFilterOrOrderChange()" placeholder="Filtrar por tipo..." class="form-control w-auto" />
        <input type="text" [(ngModel)]="tagName" (input)="onFilterOrOrderChange()" placeholder="Filtrar por tag..." class="form-control w-auto" />
    </div>

    <!-- Contenedor para los filtros y el orden-->
    <div class="contenedor-filtro-orden my-3 d-flex justify-content-center gap-3">
        <select [(ngModel)]="selectedRarity" (change)="onFilterOrOrderChange()" class="dropdown-filtro form-select w-auto">
            <option value="todos">Todos</option>
            <option value="comun">Común</option>
            <option value="infrecuente">Infrecuente</option>
            <option value="rara">Rara</option>
            <option value="rara doble">Rara doble</option>
            <option value="rara ilustracion">Rara ilustración</option>
            <option value="rara ilustracion especial">Rara ilustración especial</option>
            <option value="rara hiper">Rara Híper</option>
        </select>

        <select [(ngModel)]="selectedOrder" (change)="onFilterOrOrderChange()" class="dropdown-filtro form-select w-auto">
            <option value="fecha-desc">Recientes</option>
            <option value="fecha-asc">Más antiguos</option>
            <option value="nombre">Alfabéticamente</option>
            <option value="tipo">Tipos</option>
            <option value="rareza">Rareza</option>
        </select>
    </div>

    <!-- Contenedor para las cartas -->
    <div class="cartas-contenedor container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-3 g-4">
            <div class="col" *ngFor="let card of myCards">
                <div class="card cartas shadow-sm">
                    <img class="img-carta card-img-top" [src]="card.imageUrl" [alt]="card.pokemonName">
                    <div class="carta-body card-body text-center">
                        <h5 class="nombre-pokemon card-title">{{ card.pokemonName }}</h5>
                        <p class="rareza-carta card-text">{{ card.rarity }}</p>
                        <p class="precio-carta card-text">Precio: {{ card.price }}€</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Division de error -->
    <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
    </div>

    <!-- Controles de paginación -->
    <div class="pagination my-3 d-flex justify-content-center gap-3 align-items-center" *ngIf="pagedResult.totalPages > 1">
        <button (click)="prevPage()" [disabled]="currentPage === 1" class="btn btn-secondary">Anterior</button>
        <span class="fs-6 fw-bold">Página {{ currentPage }} de {{ pagedResult.totalPages || 1 }}</span>
        <button (click)="nextPage()" [disabled]="currentPage === pagedResult.totalPages" class="btn btn-secondary">Siguiente</button>

    </div>
