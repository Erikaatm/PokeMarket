<div class="edit-container">
    <h2>Editar perfil</h2>

    <form (ngSubmit)="onSubmit()" #editForm="ngForm">
        <!-- currentPassword -->
        <div class="form-group">
            <label for="currentPassword">contraseña actual:</label>
            <input type="password" id="currentPassword" name="currentPassword" [(ngModel)]="currentPassword" (click)="onInputChange()" required/>
        </div>

        <!-- newPassword -->
        <div class="form-group">
            <label for="newPassword">Nueva contraseña:</label>
            <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword" (click)="onInputChange()" required/>
        </div>

        <!-- confirmNewEmail -->
        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" (click)="onInputChange()" required/>
        </div>

        <!-- Botón -->
        <button type="submit">Guardar cambios</button>

        <!-- Mensajes -->
        <div *ngIf="successMessage" class="success-message">
            {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>
    </form>
</div>
